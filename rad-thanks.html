<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you · RAD Network</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="rad-logo.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* RAD: a sister identity to Radiant Together. Same rounded type and sparkle, but darker, bolder, trans-flag palette, sticker cards with hard shadows */
:root{
  --ink:#2B0E22;        /* deep plum night */
  --plum:#4A1F3A;       /* Radiant Together bordeaux, the family link */
  --blue:#8AD8F8;       /* trans blue */
  --pink:#F7A8C8;       /* trans pink */
  --cream:#FFF6FB;      /* trans white, warmed */
  --lav:#ECC7F3;        /* RT lavender */
  --muted:#7a5670;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;overflow-x:hidden}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(48px,6vw,88px)}
.band.lav{background:var(--ink);color:var(--cream)}
.band.lav .svc{border-color:var(--cream)}
.band.howband{background:var(--lav);color:var(--ink)}
.band.howband .st{text-decoration-color:var(--cream)}
.band.howband .svc{box-shadow:7px 7px 0 var(--ink)}
.band.lav .section-head p{color:var(--lav)}

/* sticker headings: a highlighter swipe instead of RT's sparkle prefix */
.st{text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:.3em;text-underline-offset:-.14em;text-decoration-skip-ink:none}
.band.lav .st{text-decoration-color:#7a2f63}
.section-head{display:grid;gap:12px;margin-bottom:clamp(28px,4vw,44px)}
.section-head h2{font-size:clamp(2.1rem,5vw,3.6rem)}
.section-head p{color:var(--muted);font-size:1.15rem;max-width:60ch}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);padding-block:12px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark{width:40px;height:40px;flex:none}
.brand-text{display:grid;line-height:1}
.brand-text b{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.06em}
.brand-text small{font-size:.72rem;font-weight:700;color:var(--lav);letter-spacing:.04em}
.links{display:flex;gap:6px;align-items:center}
.links a{text-decoration:none;font-weight:800;font-size:.95rem;padding:8px 14px;border-radius:999px;white-space:nowrap}
.links a:hover{background:rgba(255,255,255,.12)}
.links a.cta{background:var(--blue);color:var(--ink);box-shadow:3px 3px 0 var(--pink)}
@media (max-width:640px){.links a:not(.cta){display:none}}
.langmenu{position:relative}
.langmenu summary{list-style:none;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.langmenu summary::-webkit-details-marker{display:none}
.langmenu summary:hover,.langmenu[open] summary{background:rgba(255,255,255,.12)}
.langmenu summary svg{width:20px;height:20px}
.langmenu .menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6px;display:grid;gap:2px;min-width:160px;box-shadow:5px 5px 0 var(--pink);z-index:30}
.langmenu .menu button{font:inherit;font-weight:800;font-size:.95rem;text-align:left;border:0;background:transparent;color:inherit;padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;gap:12px}
.langmenu .menu button:hover{background:var(--lav)}
.langmenu .menu button[aria-current="true"]{background:var(--blue)}
.langmenu .code{font-family:var(--display);font-weight:700;min-width:2.2ch}
.burger{display:none;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--cream);cursor:pointer;place-items:center;padding:0}
.burger svg{width:22px;height:22px}
.mobile-menu{position:absolute;left:18px;right:18px;top:calc(100% + 6px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:8px;display:grid;gap:2px;box-shadow:6px 6px 0 var(--blue);z-index:25}
.mobile-menu a{text-decoration:none;font-family:var(--display);font-weight:600;font-size:1.15rem;padding:12px 16px;border-radius:14px}
.mobile-menu a:hover{background:var(--lav)}
.mobile-menu a.cta{background:var(--ink);color:var(--cream);text-align:center;margin-top:4px}
@media (max-width:640px){.burger{display:grid}.links a.cta{display:none}}
@media (min-width:641px){.mobile-menu{display:none!important}}
[hidden]{display:none!important}

/* hero */
.hero{background:var(--ink);color:var(--cream);padding-block:clamp(36px,6vw,80px) clamp(56px,8vw,104px);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;display:grid;gap:26px;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:center}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.hero-art{order:-1;justify-self:start;width:120px!important;transform:rotate(-4deg)}}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"✦";color:var(--pink);letter-spacing:0}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);letter-spacing:-.01em;margin-top:10px}
.tilt{display:inline-block;background:var(--cream);color:var(--ink);padding:0 .22em .06em;border-radius:.35em;transform:rotate(-3deg);box-shadow:.08em .08em 0 var(--pink);white-space:nowrap}
.hero .lede{font-size:clamp(1.1rem,2vw,1.3rem);max-width:56ch;color:var(--lav);font-weight:600}
.hero .copy-col{display:grid;gap:22px}
.hero-art{width:100%;max-width:340px;justify-self:end;transform:rotate(4deg);filter:drop-shadow(10px 10px 0 var(--plum))}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--display);font-weight:600;font-size:1.08rem;padding:13px 26px;border-radius:999px;border:3px solid var(--ink);transition:transform .15s,box-shadow .15s}
.btn.primary{background:var(--pink);color:var(--ink);box-shadow:5px 5px 0 var(--blue)}
.btn.soft{background:var(--cream);color:var(--ink);box-shadow:5px 5px 0 var(--pink)}
.hero .btns{align-items:center;gap:12px}
.hero .btn{border:0;padding:16px 29px}
.btn.inst{background:var(--blue);color:var(--ink);box-shadow:4px 4px 0 var(--pink)}
.btn.pro{background:var(--pink);color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
.hero .btn:active{box-shadow:none}
.btn-spark{width:30px;height:30px;flex:none}
@media (max-width:480px){.hero .btns{flex-wrap:nowrap;gap:8px}.hero .btn{padding:14px 17px;font-size:.98rem;white-space:nowrap}.btn-spark{width:22px;height:22px}}
.hero .btn:active{transform:translate(1px,1px)}
.btn:hover{transform:translate(-2px,-2px)}
.btn:active{transform:translate(3px,3px);box-shadow:none}

/* marquee: trans stripes */
.topics{background:linear-gradient(var(--blue) 0 20%,var(--pink) 0 40%,var(--cream) 0 60%,var(--pink) 0 80%,var(--blue) 0);border-block:3px solid var(--ink);overflow:hidden;padding-block:14px}
.topics-track{display:flex;gap:30px;width:max-content;animation:scroll 45s linear infinite}
.topics span{font-family:var(--display);font-weight:700;font-size:1.15rem;white-space:nowrap;display:inline-flex;align-items:center;gap:30px;color:var(--ink);background:var(--cream);padding:2px 14px;border-radius:999px;border:2px solid var(--ink)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* split intro */
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,64px)}
.split > *{display:grid;gap:14px;align-content:start;min-width:0}
.split h2{font-size:clamp(1.8rem,3.8vw,2.7rem)}
.split p{font-size:clamp(1.12rem,1.9vw,1.3rem);line-height:1.6}

/* sticker cards */
.svc{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:clamp(22px,3vw,30px);display:grid;gap:12px;align-content:start;min-width:0;box-shadow:7px 7px 0 var(--pink)}
.svc:nth-child(3n+2){box-shadow:7px 7px 0 var(--blue)}
.svc:nth-child(3n+3){box-shadow:7px 7px 0 var(--lav)}
.svc h3{font-size:clamp(1.4rem,2.6vw,1.75rem)}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:860px){.services{grid-template-columns:minmax(0,1fr)}}
.rad-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;counter-reset:s}
@media (max-width:860px){.rad-steps{grid-template-columns:minmax(0,1fr)}}
.rad-steps .svc h3::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--cream);font-size:1.1rem;margin-right:10px;vertical-align:middle;transform:rotate(-6deg)}
.how{margin-top:26px;background:var(--plum);color:var(--cream);border-radius:24px;padding:clamp(22px,3vw,32px);display:grid;gap:18px;border:3px solid var(--cream)}
.how h3{font-size:1.6rem;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{font-family:var(--display);font-weight:600;padding:7px 18px;border-radius:999px;color:var(--ink);border:2px solid var(--ink)}
.pills .pill:nth-child(1){background:var(--blue)}.pills .pill:nth-child(2){background:var(--pink)}.pills .pill:nth-child(3){background:var(--cream)}

/* professions */
.profs{display:flex;flex-wrap:wrap;gap:12px}
.prof{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:600;display:inline-flex;gap:10px;align-items:center;box-shadow:4px 4px 0 var(--blue)}
.prof:nth-child(even){box-shadow:4px 4px 0 var(--pink)}
.prof small{font-family:var(--body);font-weight:800;font-size:.72rem;background:var(--ink);color:var(--cream);padding:2px 9px;border-radius:999px}
.prof.more{background:var(--ink);color:var(--cream);box-shadow:4px 4px 0 var(--pink)}
.prof.soon{border-style:dashed;box-shadow:none;color:var(--muted);background:transparent}
.prof.soon small{background:var(--lav);color:var(--ink)}
.note{color:var(--muted);font-size:.95rem;margin-top:18px}

/* forms */
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;align-items:start}
@media (max-width:860px){.forms{grid-template-columns:minmax(0,1fr)}}
.forms form{gap:6px}
.forms .hint{color:var(--muted);font-size:.98rem;margin-bottom:6px}
.forms label{font-weight:800;font-size:.95rem;margin-top:10px}
.forms input,.forms select,.forms textarea{width:100%;font:inherit;color:var(--ink);padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.forms input:focus,.forms select:focus,.forms textarea:focus{outline:none;box-shadow:4px 4px 0 var(--blue)}
.forms textarea{min-height:96px;resize:vertical}
.forms .check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.92rem;margin-top:12px}
.forms .check input{width:auto;margin-top:5px;flex:none;accent-color:var(--plum)}
.forms button.btn{cursor:pointer;margin-top:16px;width:100%}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.road{grid-template-columns:minmax(0,1fr)}}
.road div{background:transparent;border:3px dashed var(--lav);border-radius:20px;padding:18px 20px;display:grid;gap:4px}
.road div:first-child{border-style:solid;border-color:var(--blue);background:rgba(138,216,248,.12)}
.road b{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--pink)}

/* faq */
.faq details{background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:16px 20px;margin-bottom:14px;box-shadow:5px 5px 0 var(--lav)}
.faq details[open]{box-shadow:5px 5px 0 var(--blue)}
.faq summary{font-family:var(--display);font-weight:600;font-size:1.18rem;cursor:pointer}
.faq details p{margin-top:8px}

/* trans stripe divider */
.rainbow{height:10px;width:min(260px,70%);border-radius:999px;border:2px solid var(--ink);background:linear-gradient(90deg,var(--blue) 0 20%,var(--pink) 0 40%,#fff 0 60%,var(--pink) 0 80%,var(--blue) 0)}
.rainbow.center{margin-inline:auto}

/* contact */
.contact{background:var(--ink);color:var(--cream);border-radius:32px;padding:clamp(32px,6vw,60px);display:grid;gap:18px;justify-items:start;box-shadow:10px 10px 0 var(--pink)}
.contact h2{font-size:clamp(2rem,5vw,3.2rem)}
.mailrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail{font-family:var(--display);font-weight:600;font-size:clamp(.95rem,4vw,1.5rem);background:var(--blue);color:var(--ink);border-radius:999px;padding:10px 20px;overflow-wrap:anywhere;text-decoration:none}
.copy{font-family:var(--display);font-weight:600;font-size:1rem;padding:10px 18px;border-radius:999px;border:3px solid var(--cream);background:transparent;color:var(--cream);cursor:pointer}
.copy:hover{background:var(--cream);color:var(--ink)}

footer{padding-block:36px 52px;font-size:.95rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{font-weight:800}
.family{display:inline-flex;align-items:center;gap:8px}
.family svg{width:22px;height:22px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
<style>
body{background:var(--ink);color:var(--cream);min-height:100vh;display:flex;flex-direction:column}
.thanks{flex:1;display:grid;place-items:center;padding-block:clamp(40px,8vw,96px)}
.thanks .card{background:var(--cream);color:var(--ink);border-radius:32px;padding:clamp(28px,6vw,56px);max-width:620px;display:grid;gap:18px;justify-items:start;box-shadow:10px 10px 0 var(--pink)}
.thanks-art{width:84px;height:84px;transform:rotate(-6deg)}
.thanks h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.thanks p{font-size:1.15rem}
.thanks .btn.alt{background:var(--pink);box-shadow:4px 4px 0 var(--blue)}
.thanks .btn{border:0;background:var(--blue);color:var(--ink);box-shadow:4px 4px 0 var(--pink)}
footer{color:var(--lav)}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="rad.html" aria-label="RAD Network by Radiant Together">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#3a1530"/><circle cx="24" cy="32" r="14" fill="none" stroke="#8AD8F8" stroke-width="6"/><circle cx="40" cy="32" r="14" fill="none" stroke="#F7A8C8" stroke-width="6"/><path d="M24 18 A14 14 0 0 1 36.1 25" fill="none" stroke="#8AD8F8" stroke-width="6"/><path d="M32 19.4 C33.08 27.44 34.88 29.48 42.2 32 C34.88 34.52 33.08 36.56 32 44.6 C30.92 36.56 29.12 34.52 21.8 32 C29.12 29.48 30.92 27.44 32 19.4Z" fill="#FFF6FB"/></svg>
      <span class="brand-text"><b>RAD</b><small data-i18n="byRT">by Radiant Together</small></span>
    </a>
  </div>
</header>
<main class="thanks">
  <div class="wrap" style="display:grid;place-items:center">
    <div class="card">
      <svg class="thanks-art" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#3a1530"/><circle cx="24" cy="32" r="14" fill="none" stroke="#8AD8F8" stroke-width="6"/><circle cx="40" cy="32" r="14" fill="none" stroke="#F7A8C8" stroke-width="6"/><path d="M24 18 A14 14 0 0 1 36.1 25" fill="none" stroke="#8AD8F8" stroke-width="6"/><path d="M32 19.4 C33.08 27.44 34.88 29.48 42.2 32 C34.88 34.52 33.08 36.56 32 44.6 C30.92 36.56 29.12 34.52 21.8 32 C29.12 29.48 30.92 27.44 32 19.4Z" fill="#FFF6FB"/></svg>
      <h1 data-i18n="t">Thank you!</h1>
      <p data-i18n="x">We've received your message. A real person reads every request, and we'll reply personally within a week.</p>
      <div class="btns"><a class="btn" href="rad.html" data-i18n="b">Back to RAD</a><a class="btn alt" href="index.html" data-i18n="b2">Back to Radiant Together</a></div>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>RAD Network · <span data-i18n="byRT">by Radiant Together</span></span>
    <nav aria-label="Legal"><a href="index.html">Radiant Together</a><a href="imprint.html" data-href-de="impressum.html" data-i18n="legal">Imprint &amp; Data Protection</a></nav>
  </div>
</footer>
<script>
(function(){
  var DE={t:'Vielen Dank!',x:'Wir haben Ihre Nachricht erhalten. Jede Anfrage wird persönlich gelesen, und wir antworten Ihnen innerhalb einer Woche.',b:'Zurück zu RAD',b2:'Zurück zu Radiant Together',byRT:'von Radiant Together',legal:'Impressum &amp; Datenschutz'};
  var lang='en';try{lang=localStorage.getItem('rt-lang')||'en'}catch(e){}
  if(lang!=='de')return;
  document.documentElement.lang='de';document.title='Vielen Dank · RAD Network';
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){var k=el.getAttribute('data-i18n');if(DE[k])el.innerHTML=DE[k]});
  [].forEach.call(document.querySelectorAll('[data-href-de]'),function(el){el.setAttribute('href',el.getAttribute('data-href-de'))});
})();
</script>
</body>
</html>

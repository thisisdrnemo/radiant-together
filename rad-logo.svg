<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RAD Network">
  <!-- RAD mark: two linked rings (institution + professional, trans blue + trans pink) with the Radiant Together sparkle where they meet -->
  <rect width="64" height="64" rx="18" fill="#2B0E22"/>
  <circle cx="24" cy="32" r="14" fill="none" stroke="#8AD8F8" stroke-width="6"/>
  <circle cx="40" cy="32" r="14" fill="none" stroke="#F7A8C8" stroke-width="6"/>
  <!-- re-draw the top of the blue ring over the pink one so the rings interlock -->
  <path d="M24 18 A14 14 0 0 1 36.1 25" fill="none" stroke="#8AD8F8" stroke-width="6" stroke-linecap="butt"/>
  <path d="M32 19.4 C33.08 27.44 34.88 29.48 42.2 32 C34.88 34.52 33.08 36.56 32 44.6 C30.92 36.56 29.12 34.52 21.8 32 C29.12 29.48 30.92 27.44 32 19.4Z" fill="#FFF6FB"/>
</svg>
